<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        
        <!-- HERO SECTION -->
        <section class="hero-banner">
            <header class="hero-title">
                <h1>🌴Welcome to Winter Garden🌴</h1>
                <h2>Explore a cultural hub teeming with a myriad of entertainment</h2>
            </header>   
        </section>

        <!-- ACTIVITIES SECTION -->
        <div class="gradient">
            <section class="activities">
                <div id="act-title">
                    <h3>A few fun ideas</h3><br>
                </div>
                <div class="options">
                    <img id="left-orange" src="images/oranges-edit.png">
                    <a href="https://www.cwgdn.com/325/Garden-Theatre-on-Plant" target="_blank">    
                        <img id="theatre" src="images/wg-theatre.jpg" alt="picture of theatre entrance">
                    </a>
                    <p id="theatre-text">Theatre</p>
                    
                    <a href="https://www.cwgdn.com/330/Winter-Garden-Farmers-Market" target="_blank">
                        <img id="farm-market" src="images/farmer-markets.jpg">
                    </a>
                    <p id="farm-market-text">Farm Market</p>
                    
                    <a href="https://downtownwg.com/locations/west-orange-trail/" target="_blank">
                        <img id="biking" src="images/west-orange-bike-trail.jpg">
                    </a>    
                    <p id="bike-trail-text">Biking</p>
                    
                    <img id="right-orange" src="images/oranges-edit.png">
                </div>
            </section>

        <!-- GUIDE SECTION -->
            <section class="guide">
                <div>
                    <h3>Your guide</h3>
                    <p>"Though I have only recently moved to Winter Garden, FL, I am excited to explore and share my discoveries!"</p>
                    <h4>Paul James Saulle</h4>
                    <a href="https://www.linkedin.com/in/paul-saulle-582b9b170" target="_blank" rel="noopener noreferrer">
                    <img id="profile-pic" src="images/throne.JPG" alt="profile picture of Paul James Saulle">
                    </a>
                </div>
            </section>
        </div>
    </body>
</html>
